[project]
name = "Optimizer-Search-on-PlainLM"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "absl-py>=2.1.0",
    "datasets>=3.5.0",
    "neural-pipeline-search",
    "pyyaml>=6.0.2",
    "transformers>=4.44.2",
    "wandb>=0.17.9",
    "zstandard>=0.23.0",
]

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.lint]
extend-select = [
    "BLE",      # disallow catch-all exceptions
    "COM",      # enforce trailing comma rules
    "F",        # Pyflakes rules
    "FA",       # Enforce from __future__ import annotations
    "I",        # Isort rules
    "ICN",      # Use common import conventions
    "PLE",      # Pylint Errors
    "TID",      # Some good import practices
]

[tool.uv.sources]
neural-pipeline-search = { git = "https://github.com/automl/neps", rev = "neps-spaces-updates" }
